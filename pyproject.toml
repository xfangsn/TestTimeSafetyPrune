[project]
name = "ttsafety"
version = "0.1.0"
description = "Refusal-direction extraction and activation steering for LLM safety research"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7.0",
    "transformers>=4.45.0",
    "datasets>=2.20.0",
    "accelerate>=0.34.0",
    "numpy>=1.26.0",
    "matplotlib>=3.10.9",
    "scienceplots>=2.2.2",
    "peft>=0.20.0",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttsafety"]

# --- uv: RTX 5090 (Blackwell, sm_120) needs a CUDA 12.8+ wheel of torch ---
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
